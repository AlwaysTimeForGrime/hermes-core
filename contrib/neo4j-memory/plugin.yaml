name: neo4j-memory
version: 0.1.0
description: Secondary Neo4j turn sink and versioned topic-context ledger.
kind: standalone
config_schema:
  enabled: {type: bool, default: false}
  database: {type: str, default: neo4j}
  content_max_bytes: {type: int, minimum: 1, maximum: 262144, default: 65536}
  debug_trace_enabled: {type: bool, default: false}
  trace_max_bytes: {type: int, minimum: 1, maximum: 262144, default: 65536}
  uri: {type: secret}
  username: {type: secret}
  password: {type: secret}
